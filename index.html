<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://thumb.wikimedia.org https://upload.wikimedia.org; connect-src 'self' https://*.supabase.co; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bidou</title>
<meta name="description" content="Tes repas de la semaine, au temps que tu as envie de passer en cuisine.">
<meta name="theme-color" content="#F2DCC2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A0F09" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bidou">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

<link rel="preload" as="font" type="font/woff" href="fonts/inter-400.woff" crossorigin>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400;font-display:swap;src:url(fonts/inter-400.woff) format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/inter-600.woff) format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/inter-700.woff) format("woff")}
@font-face{font-family:"Inter";font-style:normal;font-weight:800;font-display:swap;src:url(fonts/inter-800.woff) format("woff")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-600.woff) format("woff")}
@font-face{font-family:"Fredoka";font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-700.woff) format("woff")}
@font-face{font-family:"Instrument Serif";font-style:italic;font-weight:400;font-display:swap;src:url(fonts/instrument-serif-italic.woff) format("woff")}
/* Bidou · Cannelle (curcuma en touche). Écran unique façon appli : bandeau curcuma en haut, cartes blanches bordées, barre d'onglets en bas. */
:root{
  --bg:#f6e8d8; --surface:#fffaf3; --surface-2:#f0dcc5; --ink:#2a160d; --muted:#6b4630; --line:#e6ccb0;
  --accent:#8f5232; --on-accent:#fff1e2; --band:#8f5232; --on-band:#fff1e2; --band-soft:rgba(255,241,226,.16);
  --spice:#efb64a; --on-spice:#2a160d; --band-glow:rgba(239,182,74,.32);
  --ex-bg:#efb64a; --ex-fg:#2a160d; --no-bg:#8f5232; --no-fg:#fff1e2; --lo-bg:#4f6a33; --lo-fg:#fff1e2;
  --danger:#a8321a; --ok:#4f6a33; --shadow:0 4px 14px rgba(110,55,20,.10); --scrim:rgba(42,22,13,.5);
  --f-display:"Fredoka","Avenir Next Rounded","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1b110b; --surface:#27180f; --surface-2:#352116; --ink:#fbefe3; --muted:#d4b59c; --line:#4a2f1f;
  --accent:#d4885a; --on-accent:#1b110b; --band:#5e331d; --on-band:#fbefe3; --band-soft:rgba(251,239,227,.12);
  --spice:#efb64a; --on-spice:#1b110b; --band-glow:rgba(239,182,74,.18);
  --ex-bg:#5a4012; --ex-fg:#f8d98f; --no-bg:#d4885a; --no-fg:#1b110b; --lo-bg:#4f6a33; --lo-fg:#eef5e3;
  --danger:#f08a6a; --ok:#9cc27f; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1b110b; --surface:#27180f; --surface-2:#352116; --ink:#fbefe3; --muted:#d4b59c; --line:#4a2f1f;
  --accent:#d4885a; --on-accent:#1b110b; --band:#5e331d; --on-band:#fbefe3; --band-soft:rgba(251,239,227,.12);
  --spice:#efb64a; --on-spice:#1b110b; --band-glow:rgba(239,182,74,.18);
  --ex-bg:#5a4012; --ex-fg:#f8d98f; --no-bg:#d4885a; --no-fg:#1b110b; --lo-bg:#4f6a33; --lo-fg:#eef5e3;
  --danger:#f08a6a; --ok:#9cc27f; --shadow:none; --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;min-height:100dvh;-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:-.005em;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:720px;margin:0 auto}
.gutter{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}

/* bandeau */
.band{background:var(--band);color:var(--on-band);border-radius:0 0 28px 28px;padding-top:calc(env(safe-area-inset-top) + 14px);padding-bottom:20px}
.band .wrap{display:flex;flex-direction:column;gap:12px}
.band-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:22px;color:inherit;text-decoration:none}
.brand .badge{width:36px;height:36px;border-radius:50%;background:#fff1e2;display:flex;align-items:center;justify-content:center;flex:none}
.band h1{font-size:32px;line-height:1.05}
.band .sub{font-size:14px;opacity:.85}
.band input[type=text]{background:#fff8ec;color:#22150f;border:0}
:root[data-theme="dark"] .band input[type=text]{background:var(--surface-2);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band input[type=text]{background:var(--surface-2);color:var(--ink)}}
.band .seg{background:var(--band-soft)}
.band .chip{border-color:currentColor;background:transparent;color:inherit}
.band .chip[aria-pressed="true"]{background:#fff1e2;color:#22150f;border-color:#fff1e2}

/* contenu */
main{padding-top:16px;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:14px 16px}
.section-title{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px}
textarea{resize:vertical;min-height:96px;line-height:1.45}
input[type=number]{width:110px}
label.lbl,.lbl{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:13px 18px;font-weight:700;font-size:15px;background:var(--surface-2);color:var(--ink);text-decoration:none;white-space:nowrap;min-height:46px}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;border:2px solid currentColor}
.btn.small{padding:8px 14px;min-height:36px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn svg{width:18px;height:18px}
.icon-btn{width:42px;height:42px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.icon-btn.on{color:var(--ink);background:var(--surface-2)}
.icon-btn.fav.on{color:#c2461a}
.icon-btn.fav.on svg path{fill:currentColor}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--surface-2)}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600;color:inherit;opacity:.8;min-height:34px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);opacity:1;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.seg.full{display:flex}.seg.full button{flex:1}
.seg.modes button[data-mode="express"][aria-pressed="true"]{background:var(--ex-bg);color:var(--ex-fg)}
.seg.modes button[data-mode="normal"][aria-pressed="true"]{background:var(--no-bg);color:var(--no-fg)}
.seg.modes button[data-mode="long"][aria-pressed="true"]{background:var(--lo-bg);color:var(--lo-fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px;font-weight:600;min-height:38px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip svg{width:15px;height:15px}
.chip .x{border:0;background:none;padding:0 0 0 2px;font-size:18px;line-height:1;color:inherit}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.express{background:var(--ex-bg);color:var(--ex-fg)}
.tag.normal{background:var(--no-bg);color:var(--no-fg)}
.tag.long{background:var(--lo-bg);color:var(--lo-fg)}
.tag.season{background:transparent;border:1.5px solid var(--ok);color:var(--ok);padding:2px 8px}
.tag.mine{background:var(--surface-2);color:var(--muted)}

/* semaine */
.day{display:flex;flex-direction:column;gap:10px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 4px}
.day-head h2{font-size:20px}
.slot{display:flex;flex-direction:column;gap:8px}
.slot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.slot-name{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.meal{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:12px 12px 6px 14px}
.meal-open{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px}
.meal-name{font-weight:700;font-size:16px;line-height:1.28}
.meal-meta{font-size:13px;color:var(--muted)}
.meal-foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.meal-foot .tags{display:flex;gap:6px;flex-wrap:wrap}
.meal-acts{display:flex}
.meal.empty{box-shadow:none;border-style:dashed;background:transparent;padding:12px 14px;color:var(--muted);font-size:14px}
.meal.busy{box-shadow:none;background:transparent;border-style:dashed;padding:12px 14px;color:var(--muted);font-size:14px;animation:pulse 1.4s ease-in-out infinite}
.warn{font-size:12px;color:var(--danger);font-weight:600}
@keyframes pulse{50%{opacity:.45}}
.progress{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.bar{flex:1;height:8px;background:var(--band-soft);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--on-band);border-radius:999px;transition:width .4s}
.bar.indet span{width:35%;animation:pulse 1.2s ease-in-out infinite}

/* courses */
.aisle h3{font-family:var(--f-body);font-size:15px;font-weight:800;display:flex;justify-content:space-between;margin-bottom:4px}
.aisle ul{list-style:none;margin:0;padding:0}
.aisle li{border-top:1px solid var(--line)}
.aisle li:first-child{border-top:0}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 12px;align-items:start;padding:10px 0;cursor:pointer}
.item input{width:22px;height:22px;margin:0;accent-color:#b9831f}
.item .nm{min-width:0;font-weight:600}
.item .for{display:block;font-size:12px;color:var(--muted);font-weight:400}
.item .q{font-weight:700;white-space:nowrap}
.item.done .nm,.item.done .q{text-decoration:line-through;color:var(--muted)}
.xrow{display:flex;align-items:center}.xrow .item{flex:1}

/* carnet / idées */
.rcard{display:flex;flex-direction:column;gap:8px}
.rcard h3{font-family:var(--f-body);font-size:16px;font-weight:800;line-height:1.28}
.rcard p{font-size:14px;color:var(--muted)}
.rcard .foot{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.rcard select{width:auto;flex:1 1 150px;padding:9px 12px;font-size:14px;border-radius:999px}
.empty-state{text-align:center;padding:28px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty-state h3{color:var(--ink);font-size:19px}

/* barre d'onglets */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left))}
.tabbar .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);text-decoration:none;position:relative}
.tabbar a svg{width:24px;height:24px}
.tabbar a[aria-current="page"]{color:var(--ink);font-weight:800}
.tabbar a[aria-current="page"] .ic{background:var(--accent);color:var(--on-accent)}
.tabbar .ic{display:flex;padding:3px 16px;border-radius:999px}
.tabbar .count{position:absolute;top:2px;left:calc(50% + 10px);background:var(--ink);color:var(--bg);font-size:10px;font-weight:800;border-radius:999px;padding:0 6px;line-height:16px}

/* écrans plein (accueil, questionnaire) */
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 20px)}
.screen .wrap{width:100%;flex:1;display:flex;flex-direction:column;gap:20px}
.welcome{background:var(--band);color:var(--on-band)}
.welcome .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
.welcome .logo-big{width:190px;height:190px;border-radius:50%;background:#fff1e2;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 10px var(--band-soft),0 22px 50px rgba(60,30,0,.25)}
.welcome h1{font-size:58px}
.welcome .tagline{font-size:18px;max-width:22ch;opacity:.9}
.welcome .note{font-size:12px;text-align:center;opacity:.85}
.welcome .btn.primary{background:var(--spice);color:var(--on-spice)}
:root[data-theme="dark"] .welcome .btn.primary{background:var(--spice);color:var(--on-spice)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .welcome .btn.primary{background:var(--spice);color:var(--on-spice)}}
.ob-top{display:flex;align-items:center;gap:12px}
.ob-bar{flex:1;display:grid;gap:4px}
.ob-bar span{height:5px;border-radius:999px;background:var(--line)}
.ob-bar span.on{background:var(--accent)}
.ob h1{font-size:32px;line-height:1.08}
.ob .lead{font-size:16px;color:var(--muted)}
.ob-actions{display:flex;gap:10px;margin-top:auto;padding-top:12px}
.ob-actions .btn.primary{flex:1}
.checklist{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:4px 16px}
.checklist label{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 0;border-top:1px solid var(--line);font-size:17px;font-weight:600;cursor:pointer}
.checklist label:first-child{border-top:0}
.checklist input{width:24px;height:24px;accent-color:#b9831f}
.planrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.planrow:first-child{border-top:0}
.planrow b{font-size:15px;min-width:76px}
.stepper{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border-radius:999px;padding:4px}
.stepper button{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);font-size:20px;font-weight:800}
.stepper span{min-width:44px;text-align:center;font-weight:800;font-size:18px}
.big-stepper .stepper button{width:56px;height:56px;font-size:26px}
.big-stepper .stepper span{min-width:70px;font-size:34px;font-family:var(--f-display)}

/* fiche recette et feuilles */
.sheet-wrap{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-wrap.modal{background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-wrap.modal .panel{background:var(--bg);width:100%;max-width:640px;border-radius:24px 24px 0 0;padding:20px max(16px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow-y:auto}
.r-band .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.r-band .fact{background:var(--band-soft);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column}
.r-band .fact b{font-size:16px}
.r-band .fact span{font-size:11px;opacity:.85}
.ing{list-style:none;margin:0;padding:0}
.ing li{border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;cursor:pointer;font-size:15px}
.ing input{width:22px;height:22px;margin:0;accent-color:#b9831f}
.ing input:checked~span{text-decoration:line-through;color:var(--muted)}
.ing .q{font-weight:700;color:var(--muted);white-space:nowrap}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px;counter-reset:s}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:12px;font-size:15px;line-height:1.5}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.tip{background:var(--surface-2);border-radius:14px;padding:12px 14px;font-size:14px}
.r-actions{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.r-actions .wrap{display:flex;gap:10px;align-items:center}
.r-actions select{flex:1;border-radius:999px}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:14px;font-weight:600;max-width:min(520px,calc(100vw - 32px));box-shadow:0 8px 24px rgba(0,0,0,.25)}
.notice{background:var(--surface-2);border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.err{color:var(--danger);font-size:14px;font-weight:600}
/* ===== v2 : composants visuels ===== */
.band.compact{padding-bottom:16px}
.band.compact .wrap{gap:10px}
.band h1{font-size:30px}
.pill{font-size:13px;font-weight:700;background:var(--band-soft);border-radius:999px;padding:5px 11px;white-space:nowrap}
.row.nowrap{flex-wrap:nowrap}
.row.nowrap input{flex:1}
.btn.dark span{display:inline}
.row.quick{gap:8px}
.qchip{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:6px 12px;min-height:38px;font-size:14px;font-weight:700;background:var(--band-soft);color:inherit}
.qchip svg{width:18px;height:18px}
.qchip[aria-pressed="true"]{background:#fff1e2;color:#22150f}
.qchip.dark{background:var(--ink);color:var(--bg)}
.qchip.light{background:var(--surface-2);color:var(--ink)}
.stepper.mini{background:transparent;padding:0;gap:2px}
.stepper.mini button{width:28px;height:28px;font-size:16px;background:rgba(255,255,255,.55);color:#22150f}

.cuisines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cuisine{position:relative;border:2px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);padding:0;display:flex;flex-direction:column;text-align:left;min-height:96px;color:var(--ink)}

.pat-tout{background:conic-gradient(from 0deg,#e3a93a,#c93224,#6a2c63,#0d5eaf,#2e8b57,#e3a93a)}
.pat-fr{background:repeating-linear-gradient(0deg,rgba(200,40,40,.55) 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,rgba(200,40,40,.55) 0 8px,#fff 8px 16px)}
.pat-it{background:repeating-linear-gradient(0deg,rgba(0,146,70,.5) 0 9px,transparent 9px 18px),repeating-linear-gradient(90deg,rgba(206,43,55,.5) 0 9px,#fff7ee 9px 18px)}
.pat-es{background:repeating-conic-gradient(#f1bf00 0 25%,#c8102e 0 50%) 0 0/18px 18px}

.pat-th{background:repeating-linear-gradient(45deg,#6a1b9a 0 10px,#f1c40f 10px 14px)}
.pat-vn{background:radial-gradient(circle,#f9d71c 3px,transparent 4px) 0 0/18px 18px,#c0392b}
.pat-jp{background:radial-gradient(circle at 50% 100%,transparent 5px,#c0392b 6px 7.5px,transparent 8.5px 10px,#c0392b 11px 12.5px,transparent 13.5px) 0 0/24px 12px,#fff7ee}
.pat-kr{background:repeating-conic-gradient(#e74c3c 0 25%,#2980b9 0 50%,#f1c40f 0 75%,#27ae60 0) 0 0/28px 28px}
.pat-cn{background:repeating-linear-gradient(0deg,transparent 0 10px,#f1c40f 10px 12px),repeating-linear-gradient(90deg,#c0392b 0 10px,#f1c40f 10px 12px)}

.pat-us{background:repeating-conic-gradient(#c62828 0 25%,#fff 0 50%) 0 0/16px 16px}
.pat-af{background:repeating-linear-gradient(90deg,#f1c40f 0 8px,#27ae60 8px 16px,#c0392b 16px 24px,#111 24px 28px)}
.people{display:flex;justify-content:center;flex-wrap:wrap;gap:4px;color:var(--accent);min-height:56px;align-items:flex-end}

.daydots{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}

.timeopts.small .topt{min-height:60px;padding:8px 4px}

.sub-opt{padding:0 4px}

:root[data-theme="dark"] .tile.allergen[aria-pressed="true"],:root[data-theme="dark"] .chip.no[aria-pressed="true"],:root[data-theme="dark"] .notice.danger,:root[data-theme="dark"] .ing li.danger{background:#4a1d14;color:#ffd0c4}

/* ===== v5 : accueil clair, emojis, photos, jauge ronde ===== */
html{touch-action:manipulation}
button,a,label,input,select,textarea{touch-action:manipulation}
.toast{padding:9px 14px;border-radius:999px;font-size:13px;line-height:1.35;text-align:center;top:auto;bottom:calc(84px + env(safe-area-inset-bottom));max-width:min(420px,calc(100vw - 48px))}
.center{text-align:center}
.emo{font-size:17px;line-height:1;display:inline-flex}
.welcome .logo-big{width:150px;height:150px}

.levels{display:flex;flex-direction:column;gap:8px}
.lvl{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:10px 14px;color:var(--ink);min-height:58px}

.cuisine.wide{min-height:92px}

/* aliments & allergènes */
.chip .emo{font-size:16px;margin-right:1px}

.algs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.alg{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;min-height:46px;font-size:14px;font-weight:600;color:var(--ink);text-align:left}
.alg .emo{font-size:20px}
.alg[aria-pressed="true"]{background:#fde3dd;border-color:#c0391b;color:#7a1d0c}
:root[data-theme="dark"] .alg[aria-pressed="true"]{background:#4a1d14;border-color:#f08a6a;color:#ffd9cc}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alg[aria-pressed="true"]{background:#4a1d14;border-color:#f08a6a;color:#ffd9cc}}
.sec-sub{font-size:17px;margin-top:6px}
.emo-ic{display:inline-flex;width:34px;height:34px;border-radius:12px;background:var(--surface-2);align-items:center;justify-content:center;flex:none;font-size:18px}
/* jauge ronde */
.dial{position:relative;width:min(240px,72vw);margin:2px auto 6px}
.dial svg{width:100%;height:auto;display:block;touch-action:none;cursor:grab;outline:none}
.dial .dtrack,.dial .dfill{fill:none;stroke-width:16;stroke-linecap:round;transform:rotate(135deg);transform-origin:100px 100px}
.dial .dtrack{stroke:var(--surface-2)}
.dial .dfill{stroke:var(--accent)}
.dial .dknob{fill:var(--surface);stroke:var(--accent);stroke-width:5;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}

.btn.big{min-height:54px;font-size:17px}

.band,.welcome{background:radial-gradient(120% 90% at 100% 0%,var(--band-glow),transparent 60%),radial-gradient(80% 60% at 0% 100%,rgba(0,0,0,.12),transparent 70%),var(--band)}

.band input[type=search]{width:100%;background:#fff8ec;color:#2a160d;border:0;border-radius:14px;padding:12px 14px;font-size:16px}
:root[data-theme="dark"] .band input[type=search]{background:var(--surface-2);color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .band input[type=search]{background:var(--surface-2);color:var(--ink)}}
.welcome .tagline,.welcome h1{color:var(--on-band)}
.tabbar a[aria-current="page"]{color:var(--accent)}
.meal{border-left:5px solid var(--line)}
.meal:has(.timechip[data-tone="express"]){border-left-color:var(--ex-bg)}
.meal:has(.timechip[data-tone="normal"]){border-left-color:var(--no-bg)}
.meal:has(.timechip[data-tone="long"]){border-left-color:var(--lo-bg)}
.dish{flex:none;width:48px;height:48px;border-radius:16px;background:var(--surface-2);display:inline-flex;align-items:center;justify-content:center;font-size:27px;line-height:1}
.dish.big{width:62px;height:62px;border-radius:20px;font-size:36px;background:#fff1e2}
.meal-open.has-dish{flex-direction:row;align-items:center;gap:12px}
.mo-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.r-title{display:flex;align-items:center;gap:14px}
.filters{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.filters::-webkit-scrollbar{display:none}
.chip.f{flex:none;white-space:nowrap}
.cchip{flex:none;position:relative;width:96px;height:64px;border-radius:14px;overflow:hidden;border:0;padding:0;background:#3a2a1c;isolation:isolate;display:flex;align-items:flex-end}
.cchip img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}
.cchip::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,transparent 30%,rgba(20,10,4,.8))}
.cchip span{color:#fff;font-size:12px;font-weight:800;padding:5px 7px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.cchip[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--spice)}
.rcount{font-size:13px;margin:2px 4px -4px}
.rlist{padding:4px 0}
.rrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:10px 14px;text-align:left;color:var(--ink);border-bottom:1px solid var(--line)}
.rrow:last-child{border-bottom:0}
.rr-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rr-txt b{font-size:15px;line-height:1.25}
.rr-txt span{font-size:12px;color:var(--muted)}
.rrow .tag{flex:none}

/* ===== v7 : style épuré façon MacroSave, dégradés cannelle, photos, animations ===== */
:root{
  --bg:#f8f1e9; --surface:#ffffff; --surface-2:#f4ebe1; --ink:#1f140e; --muted:#7b5d4a; --line:#ecdfd1;
  --accent:#8f5232; --on-accent:#fff6ee; --band:transparent; --on-band:#1f140e; --band-soft:rgba(70,40,20,.06);
  --grad:linear-gradient(135deg,#bb7742 0%,#8f5232 58%,#6e3b22 100%); --glow:0 12px 26px -12px rgba(143,82,50,.7);
  --sel:linear-gradient(140deg,#3d281b,#1f140e); --on-sel:#fff6ee;
  --blob1:rgba(214,140,95,.30); --blob2:rgba(239,182,74,.18); --dots:rgba(90,55,30,.07);
  --ex-bg:#fdedcb; --ex-fg:#7a4f05; --no-bg:#f5e1d2; --no-fg:#7a3f1f; --lo-bg:#e4ebd9; --lo-fg:#3f5228;
  --shadow:0 1px 2px rgba(70,40,20,.05),0 10px 28px -16px rgba(70,40,20,.30);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16100c; --surface:#211812; --surface-2:#2c2018; --ink:#f8ede3; --muted:#c9ab95; --line:#3a2b20;
  --accent:#dc9362; --on-accent:#1b110b; --band:transparent; --on-band:#f8ede3; --band-soft:rgba(255,240,225,.07);
  --grad:linear-gradient(135deg,#eaa46e,#cf8251 58%,#a5603a); --glow:0 12px 26px -12px rgba(220,147,98,.55);
  --sel:linear-gradient(140deg,#f6e6d6,#dcc2ab); --on-sel:#1b110b;
  --blob1:rgba(190,110,65,.20); --blob2:rgba(239,182,74,.08); --dots:rgba(255,235,215,.05);
  --ex-bg:#4a3510; --ex-fg:#f8d98f; --no-bg:#48291a; --no-fg:#f3c7a6; --lo-bg:#2f3b22; --lo-fg:#cfe0b6;
}}
:root[data-theme="dark"]{
  --bg:#16100c; --surface:#211812; --surface-2:#2c2018; --ink:#f8ede3; --muted:#c9ab95; --line:#3a2b20;
  --accent:#dc9362; --on-accent:#1b110b; --band:transparent; --on-band:#f8ede3; --band-soft:rgba(255,240,225,.07);
  --grad:linear-gradient(135deg,#eaa46e,#cf8251 58%,#a5603a); --glow:0 12px 26px -12px rgba(220,147,98,.55);
  --sel:linear-gradient(140deg,#f6e6d6,#dcc2ab); --on-sel:#1b110b;
  --blob1:rgba(190,110,65,.20); --blob2:rgba(239,182,74,.08); --dots:rgba(255,235,215,.05);
  --ex-bg:#4a3510; --ex-fg:#f8d98f; --no-bg:#48291a; --no-fg:#f3c7a6; --lo-bg:#2f3b22; --lo-fg:#cfe0b6;
}
html{background:var(--bg)}
body{background:transparent}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(70% 42% at 100% 0%,var(--blob1),transparent 70%),radial-gradient(60% 38% at 0% 38%,var(--blob2),transparent 70%),radial-gradient(55% 35% at 100% 100%,var(--blob1),transparent 70%),radial-gradient(var(--dots) 1px,transparent 1.4px) 0 0/18px 18px}
.serif{font-family:"Instrument Serif",Georgia,"Times New Roman",serif;font-style:italic;font-weight:400;letter-spacing:0;color:var(--accent);font-size:1.12em}
h1,h2{letter-spacing:-.01em}
img.broken{visibility:hidden}
/* bandeau : plus de bloc coloré, juste le fond dégradé */
.band,.welcome{background:transparent!important;color:var(--ink)}
.band{border-radius:0;padding-bottom:8px}
.band h1{font-size:34px;line-height:1.05}
.band .pill{background:var(--surface);box-shadow:var(--shadow)}
.brand{color:var(--ink)}
.brand .badge{box-shadow:var(--shadow)}
/* boutons */
.btn{transition:transform .15s ease,box-shadow .2s ease}
.btn:active{transform:scale(.97)}
.btn.primary,.btn.spice,.screen.welcome .btn.primary{background:var(--grad);color:var(--on-accent);box-shadow:var(--glow)}
.btn.big{min-height:56px;font-size:17px}
.btn svg{flex:none}
.round-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow);transition:transform .15s}
.round-btn:active{transform:scale(.92)}
.round-btn.glass{background:rgba(255,255,255,.85);border:0;color:#1f140e;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.mic{background:var(--surface-2);color:var(--accent)}
/* sélections : sobres, encre profonde */
.seg,.seg.onband{background:rgba(70,40,20,.06)}
:root[data-theme="dark"] .seg,:root[data-theme="dark"] .seg.onband{background:rgba(255,240,225,.07)}
.seg button[aria-pressed="true"],.seg.onband button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgba(70,40,20,.14)}
.chip[aria-pressed="true"],.tile[aria-pressed="true"],.lvl[aria-pressed="true"],.alg[aria-pressed="true"],.topt[aria-pressed="true"],.kind[aria-pressed="true"],.fopt[aria-pressed="true"],.dd[aria-pressed="true"],.dpill[aria-selected="true"],.fbtn.on,.chip.no[aria-pressed="true"]{background:var(--sel)!important;color:var(--on-sel)!important;border-color:transparent!important}
.chip.no[aria-pressed="true"]{text-decoration:line-through}
.topt[aria-pressed="true"] svg,.tile[aria-pressed="true"] svg{color:inherit}
.tile,.lvl,.alg,.chip,.cuisine,.mtile,.kind,.fopt,.rg-open,.cchip,.dd,.dpill{transition:transform .16s ease,background .2s ease,color .2s ease}
.tile:active,.lvl:active,.alg:active,.chip:active,.cuisine:active,.mtile:active,.kind:active,.fopt:active,.cchip:active,.rg-open:active{transform:scale(.96)}
.card,.meal,.mtile,.lvl,.alg,.tile,.mealrow,.timecard,.switchrow,.topt{border:1px solid var(--line);box-shadow:var(--shadow);background:var(--surface)}
.mealrow.on{border-color:var(--line)}
.mealrow.on .mic{background:var(--sel);color:var(--on-sel)}
.lvl{min-height:64px;border-radius:20px}
.lvl .lic{width:42px;height:42px;border-radius:14px;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.lvl .rk{margin-left:auto;opacity:0;transition:opacity .2s}
.lvl[aria-pressed="true"] .rk{opacity:1}
.lvl[aria-pressed="true"] .lic{background:rgba(255,255,255,.14);color:inherit}
.lvl[aria-pressed="true"] .lt span{color:inherit;opacity:.75}
.alg .aic{color:var(--accent);display:flex}
.alg[aria-pressed="true"] .aic{color:inherit}
.diets .alg{min-height:52px}
.cuisine .ck svg{width:14px;height:14px}
.cuisine .ck{color:#fff}
/* questionnaire */
.obscreen{padding-top:calc(env(safe-area-inset-top) + 12px)}
.ob-top{display:flex;align-items:center;gap:10px}
.ob-count{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:14px;white-space:nowrap}
.ob-count b{font-size:26px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.ob-bar{flex:1;display:flex!important;gap:4px}
.ob-bar span{flex:1;height:4px;border-radius:99px;background:var(--line);transition:flex .4s ease,background .3s}
.ob-bar span.done{background:var(--accent);opacity:.4}
.ob-bar span.cur{background:var(--grad);flex:2.4;opacity:1}
.ob-logo{width:34px;height:34px;border-radius:50%;background:#fff1e2;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--shadow)}
.ob-head{padding-top:14px}
.ob-head h1,.ob h1{font-size:38px;line-height:1.02}
.ob .lead{font-size:15px}
.ob-body{display:flex;flex-direction:column;gap:14px}
/* accueil */
.screen.welcome{position:relative;overflow:hidden}
.welcome .wrap{position:relative;z-index:1;justify-content:center;gap:22px}
.welcome .hero{flex:0;gap:14px;padding-top:30px}
.kicker{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:7px 14px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);box-shadow:var(--shadow)}
.kicker i{width:8px;height:8px;border-radius:50%;background:var(--grad)}
.welcome .logo-big{width:112px;height:112px;box-shadow:0 0 0 8px rgba(143,82,50,.08),var(--shadow)}
.welcome h1{font-size:40px;line-height:1.02;color:var(--ink)}
.welcome .tagline{color:var(--muted);font-size:16px;max-width:30ch;opacity:1}
.floaters{position:absolute;inset:0;z-index:0;pointer-events:none}
.floaters .fl{position:absolute;border-radius:50%;overflow:hidden;border:4px solid var(--surface);box-shadow:var(--shadow);animation:float 7s ease-in-out infinite;background:var(--surface-2)}
.floaters img{width:100%;height:100%;object-fit:cover;display:block}
.fl0{top:3%;left:-26px;width:98px;height:98px}
.fl1{top:5%;right:-20px;width:124px;height:124px;animation-delay:-2s!important}
.fl2{top:21%;left:14%;width:44px;height:44px;animation-delay:-4s!important}
.fl3{top:25%;right:9%;width:52px;height:52px;animation-delay:-1s!important}
.fl4{bottom:12%;left:-30px;width:108px;height:108px;animation-delay:-3s!important}
.fl5{bottom:5%;right:-24px;width:120px;height:120px;animation-delay:-5s!important}
.fl6{bottom:26%;right:12%;width:42px;height:42px;animation-delay:-2.5s!important}
.fl7{bottom:29%;left:13%;width:38px;height:38px;animation-delay:-6s!important}
.howto{margin:4px 0 0}
.howto li{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink)}
.howto .hic{width:42px;height:42px;border-radius:14px;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.howto li span span{opacity:1;color:var(--muted)}
/* semaine */
.plan{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow)}
.prefs .pic{display:flex;color:var(--accent)}
.flow .fic{color:var(--accent);display:flex}
.flow li.cur>*{background:var(--surface);border-color:var(--accent)}
.shopcta .fic{display:flex}
article.meal{border-left:1px solid var(--line)!important}
.dish.ph{width:64px;height:64px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--line));padding:0}
.dish.ph img{width:100%;height:100%;object-fit:cover;display:block}
.dpill{background:var(--surface)}
/* fiche recette */
.r-hero{position:relative;height:min(46vh,340px);background:linear-gradient(135deg,var(--surface-2),var(--line));overflow:hidden}
.r-hero img{width:100%;height:100%;object-fit:cover;display:block}
.r-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.28),transparent 30%,transparent 55%,var(--bg) 100%)}
.r-hero-top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 12px);display:flex;justify-content:space-between;align-items:center;z-index:1}
.r-head{margin-top:-46px;position:relative;z-index:1;padding-bottom:6px}
.r-head .wrap{display:flex;flex-direction:column;gap:6px}
.r-head h1{font-size:29px;line-height:1.08}
.r-head .kick{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.r-head .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.r-head .fact{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.r-head .fact svg{color:var(--accent);margin-bottom:2px}
.r-head .fact b{font-size:16px}
.r-head .fact span{font-size:11px;color:var(--muted)}
.tag.season{background:#e4ebd9;color:#3f5228}
.tag.season svg{width:12px;height:12px}
.r-actions{background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
:root[data-theme="dark"] .r-actions{background:rgba(33,24,18,.9)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .r-actions{background:rgba(33,24,18,.9)}}
/* recettes */
.searchrow{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 12px;box-shadow:var(--shadow);color:var(--muted)}
.band .search input[type=search],.search input[type=search]{border:0;background:transparent;padding:13px 0;font-size:16px;flex:1;min-width:0;color:var(--ink);outline:none;border-radius:0}
.fbtn{position:relative;width:52px;flex:none;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow)}
.fbtn .badge{position:absolute;top:-6px;right:-6px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:20px;height:20px;padding:0 5px;display:flex;align-items:center;justify-content:center}
.kinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kind{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;box-shadow:var(--shadow)}
.actives{display:flex;flex-wrap:wrap;gap:6px}
.apill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:7px 10px 7px 12px;font-size:13px;font-weight:700;background:var(--surface-2);color:var(--ink)}
.rgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px}
@media (min-width:640px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rg{position:relative;min-width:0}
.rg-open{width:100%;border:0;background:none;padding:0;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:6px}
.rg-ph{position:relative;display:block;aspect-ratio:1/1;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,var(--surface-2),var(--line));box-shadow:var(--shadow)}
.rg-ph img{width:100%;height:100%;object-fit:cover;display:block}
.rg-time{position:absolute;left:8px;bottom:8px;display:inline-flex;gap:4px;align-items:center;font-size:11px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.rg-name{font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;padding:0 2px}
.rg-meta{font-size:12px;color:var(--muted);padding:0 2px}
.rg-fav{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#6b4630;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.rg-fav.on{color:#c0391b}
.rg-fav.on svg{fill:currentColor}
.fopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fopt{display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.fopt svg{color:var(--accent)}
.fopt[aria-pressed="true"] svg{color:inherit}
.fopt b{font-size:13px}.fopt span{font-size:11px;opacity:.7}
.fcuis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fcuis .cchip{width:auto;height:64px}
.cchip img{transition:transform .3s}
.cchip[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.sw-txt{flex:1;display:flex;flex-direction:column;gap:1px}
.sw-txt .muted{font-size:12px;font-weight:500}
.big-ic{color:var(--accent);display:flex}
.chip svg{width:16px;height:16px}
/* menu Moi */
.mtiles{grid-template-columns:repeat(2,minmax(0,1fr))}
.mtile{min-height:92px;border-radius:20px}
.mtile .mic{margin-bottom:6px}
/* barre d'onglets */
.tabbar{background:rgba(255,255,255,.84);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px)}
:root[data-theme="dark"] .tabbar{background:rgba(33,24,18,.86)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabbar{background:rgba(33,24,18,.86)}}
.tabbar a[aria-current="page"] .ic{background:var(--grad);color:var(--on-accent);box-shadow:var(--glow)}
.tabbar a[aria-current="page"]{color:var(--accent)}
/* animations */
@keyframes inFwd{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
@keyframes inBack{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popk{0%{transform:scale(1)}35%{transform:scale(.93)}70%{transform:scale(1.04)}100%{transform:scale(1)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.ob.enter .ob-head{animation:inFwd .45s cubic-bezier(.2,.8,.2,1) both}
.ob.enter.back .ob-head{animation-name:inBack}
.ob.enter .ob-body :is(.tiles,.cuisines,.levels,.algs,.chips,.stack,.timeopts,.people,.big-stepper)>*{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both}
.ob.enter .ob-body>.seg,.ob.enter .ob-body>.sec-sub,.ob.enter .ob-body>textarea{animation:cardIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:.12s}
#app.enter main .wrap>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter .rgrid>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter .band .wrap{animation:fadeIn .35s ease both}
#app.enter .welcome .hero>*,#app.enter .welcome .stack,#app.enter .welcome .howto>*{animation:cardIn .6s cubic-bezier(.2,.8,.2,1) both}
#app.enter .welcome .hero>*:nth-child(2){animation-delay:.08s}#app.enter .welcome .hero>*:nth-child(3){animation-delay:.16s}#app.enter .welcome .hero>*:nth-child(4){animation-delay:.24s}
#app.enter .welcome .stack{animation-delay:.32s}#app.enter .welcome .howto>*:nth-child(1){animation-delay:.4s}#app.enter .welcome .howto>*:nth-child(2){animation-delay:.48s}#app.enter .welcome .howto>*:nth-child(3){animation-delay:.56s}
.pop{animation:popk .38s cubic-bezier(.2,.8,.2,1)}
.sheet-wrap.opening:not(.modal){animation:slideIn .34s cubic-bezier(.2,.8,.2,1)}

.stickyfoot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);padding:16px 0 calc(16px + env(safe-area-inset-bottom));margin-bottom:calc(-20px - env(safe-area-inset-bottom))}

/* ===== v8 : cuisines illustrées (papier peint + dessin) ===== */
.cuisine,.cchip{background:var(--cu-bg)!important;color:#2a1a10}
.cuisine::before,.cchip::before{background:var(--cu-pat)!important;z-index:0;opacity:1}
.cu-art{position:absolute;right:4px;top:4px;width:62%;height:84%;z-index:1;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 6px 8px rgba(80,45,20,.18));transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.cu-art svg{width:100%;height:100%}
.cuisine .cn,.cchip>span:not(.cu-art){position:relative;z-index:2;color:#2a1a10!important;text-shadow:none!important}
.cchip .cu-art{position:absolute!important;padding:0!important}
.cuisine{border:1px solid rgba(80,45,20,.08)!important;box-shadow:var(--shadow)}
.cuisine.wide .cu-art{width:34%;right:10px}
.cuisine[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent),var(--shadow)!important}
.cuisine[aria-pressed="true"] .cu-art{transform:scale(1.08) rotate(-4deg)}
.cuisine .ck{z-index:3;background:var(--grad)!important}
.cchip .cu-art{width:58%;height:80%;right:2px;top:2px}
.cchip[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--accent)}
.cu-tout{--cu-bg:linear-gradient(140deg,#fbf3ea,#efdccb);--cu-pat:radial-gradient(rgba(255,255,255,.5) 1.5px,transparent 2px) 0 0/14px 14px}
.cu-fr{--cu-bg:linear-gradient(140deg,#eef2f9,#d6dff0);--cu-pat:repeating-linear-gradient(0deg,rgba(255,255,255,.5) 0 6px,transparent 6px 14px)}
.cu-it{--cu-bg:linear-gradient(140deg,#f8ebdd,#ecc9ad);--cu-pat:repeating-linear-gradient(0deg,rgba(255,255,255,.38) 0 8px,transparent 8px 16px),repeating-linear-gradient(90deg,rgba(255,255,255,.38) 0 8px,transparent 8px 16px)}
.cu-es{--cu-bg:linear-gradient(140deg,#fdf0d2,#f3cd8b);--cu-pat:radial-gradient(rgba(255,255,255,.5) 2px,transparent 2.6px) 0 0/14px 14px,radial-gradient(rgba(255,255,255,.35) 2px,transparent 2.6px) 7px 7px/14px 14px}
.cu-gr{--cu-bg:linear-gradient(140deg,#e8f1f6,#c3dbe8);--cu-pat:radial-gradient(circle at 50% 100%,transparent 6px,rgba(255,255,255,.5) 7px 8.5px,transparent 9.5px) 0 0/18px 9px}
.cu-ma{--cu-bg:linear-gradient(140deg,#f6e2d1,#e6b694);--cu-pat:repeating-linear-gradient(45deg,rgba(255,255,255,.38) 0 2px,transparent 2px 12px),repeating-linear-gradient(-45deg,rgba(255,255,255,.38) 0 2px,transparent 2px 12px)}
.cu-lb{--cu-bg:linear-gradient(140deg,#f1f3e3,#d7dfbb);--cu-pat:radial-gradient(ellipse 4px 2px,rgba(255,255,255,.5) 98%,transparent) 0 0/16px 12px}
.cu-in{--cu-bg:linear-gradient(140deg,#fde9cf,#f2bf83);--cu-pat:radial-gradient(rgba(255,255,255,.5) 1.5px,transparent 2px) 0 0/10px 10px,radial-gradient(rgba(255,255,255,.35) 3px,transparent 3.6px) 5px 5px/20px 20px}
.cu-th{--cu-bg:linear-gradient(140deg,#edf3e1,#cddcb2);--cu-pat:repeating-linear-gradient(45deg,rgba(255,255,255,.5) 0 2px,transparent 2px 10px)}
.cu-vn{--cu-bg:linear-gradient(140deg,#e9f2e6,#c7ddc3);--cu-pat:radial-gradient(circle,transparent 5px,rgba(255,255,255,.5) 6px 7px,transparent 8px) 0 0/20px 20px}
.cu-jp{--cu-bg:linear-gradient(140deg,#fbeae6,#f0c9c2);--cu-pat:radial-gradient(circle at 50% 100%,transparent 4px,rgba(255,255,255,.5) 5px 6px,transparent 7px,transparent 8px,rgba(255,255,255,.5) 9px 10px,transparent 11px) 0 0/22px 11px}
.cu-kr{--cu-bg:linear-gradient(140deg,#f5e8e2,#e5c3b5);--cu-pat:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px) 0 0/14px 14px}
.cu-cn{--cu-bg:linear-gradient(140deg,#fae7dd,#efbea9);--cu-pat:radial-gradient(circle,transparent 4px,rgba(255,255,255,.5) 5px 6px,transparent 7px) 0 0/16px 16px,radial-gradient(circle,transparent 4px,rgba(255,255,255,.3) 5px 6px,transparent 7px) 8px 8px/16px 16px}
.cu-mx{--cu-bg:linear-gradient(140deg,#fde9dc,#f4bf9f);--cu-pat:linear-gradient(135deg,rgba(255,255,255,.42) 25%,transparent 25%) -6px 0/12px 12px,linear-gradient(225deg,rgba(255,255,255,.42) 25%,transparent 25%) -6px 0/12px 12px}
.cu-us{--cu-bg:linear-gradient(140deg,#ebeff5,#cfd8e6);--cu-pat:repeating-conic-gradient(rgba(255,255,255,.4) 0 25%,transparent 0 50%) 0 0/14px 14px}
.cu-af{--cu-bg:linear-gradient(140deg,#f8e7cc,#e9c387);--cu-pat:repeating-linear-gradient(90deg,rgba(255,255,255,.4) 0 4px,transparent 4px 10px,rgba(143,82,50,.12) 10px 13px,transparent 13px 20px)}
/* ===== v10 : frigo, restes, cuisine pas à pas, magasin, budget & nutrition ===== */
input[type=url]{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:16px;color:var(--ink);font:inherit;font-size:16px}
.small{font-size:12.5px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-weight:700;font-size:inherit;text-decoration:underline;text-underline-offset:2px}
.note{font-size:13px;color:var(--muted);background:var(--surface-2);border-radius:12px;padding:10px 12px;margin:0}
/* semaine : glisser pour remplacer */
.mswipe{position:relative;border-radius:18px}
.mswipe-bg{position:absolute;inset:0;border-radius:18px;background:var(--sel);color:var(--on-sel);display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:0 22px;font-size:14px;opacity:0;transition:opacity .15s,background .2s}
.mswipe:has(.meal.swiping) .mswipe-bg{opacity:1}
.mswipe-bg.go{background:var(--grad)}
.mswipe-bg.show{opacity:1}
.mswipe .meal{position:relative;touch-action:pan-y;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.mswipe .meal.swiping{transition:none}
.meal.left{background:linear-gradient(135deg,var(--surface),var(--surface-2))}
.meal.left .meal-name{color:var(--muted)}
.tag.lefttag{background:var(--surface-2);color:var(--ink)}
.tag.lefttag svg{width:12px;height:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{display:grid;grid-template-columns:auto 1fr;column-gap:10px;row-gap:0;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);color:var(--ink);min-width:0}
.stat .sic,.costrow .sic{width:32px;height:32px;border-radius:50%;background:var(--surface-2);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:4px;flex:none}
.stat .sic{grid-row:span 2;margin:0}
.stat b{font-family:var(--f-display);font-size:19px;line-height:1.15;white-space:nowrap}
.stat .gauge{grid-column:1/-1}
.stat>span:not(.sic):not(.gauge){grid-column:2;line-height:1.3}
.stat>span:not(.sic):not(.gauge){font-size:12px;color:var(--muted)}
.gauge{display:block;width:100%;height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.gauge span{display:block;height:100%;border-radius:999px;background:var(--grad)}
.gauge.over span{background:#c0391b}
.daystat{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center;font-size:13px;color:var(--muted);margin:-4px 4px 2px}
.daystat span{display:inline-flex;align-items:center;gap:4px}
.daystat b{color:var(--ink)}
.daystat svg{color:var(--accent)}
.daystat .gauge{flex-basis:100%;margin-top:2px}
/* fiche recette */
.macro{margin-top:10px}
.mbar{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--surface-2)}
.mbar i{display:block;height:100%}
.mleg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
.mleg span{display:inline-flex;align-items:center;gap:6px}
.mleg i{width:9px;height:9px;border-radius:50%;display:inline-block}
.mp{background:#8f5232}.mc{background:#d9a066}.mf{background:#a9b38a}
.flag-home{color:var(--ok);display:inline-flex!important;align-items:center;gap:3px}
.notice.lefty{background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);align-items:center}
.notice.lefty>span:nth-child(2){flex:1}
.dblbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px dashed var(--line);background:transparent;border-radius:18px;padding:12px 14px;color:var(--ink)}
.dblbtn .dt{flex:1;display:flex;flex-direction:column;gap:1px}
.dblbtn .dt .muted{font-size:12.5px}
.dblbtn>svg{color:var(--accent)}
.notice.lefty .mic,.dblbtn .mic{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface-2);color:var(--accent)}
/* remplacer */
.alts{display:flex;flex-direction:column;gap:10px}
.alt{display:flex;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:8px;box-shadow:var(--shadow);color:var(--ink);transition:transform .16s}
.alt:active{transform:scale(.97)}
.alt-ph{width:74px;height:74px;border-radius:14px;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--surface-2),var(--line))}
.alt-ph img{width:100%;height:100%;object-fit:cover;display:block}
.alt-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.alt-txt b{font-size:15px;line-height:1.25}
.alt-txt .muted{font-size:12.5px}
.alt-why{display:block;font-size:12px;font-weight:700;color:var(--accent);line-height:1.35}
.alt-why.ok{color:var(--ok)}
.alt-why svg{vertical-align:-2px;margin-right:3px}
.panel .kick{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
/* courses */
.sprog{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.sprog b{color:var(--ink);font-size:16px}
.sbar{flex:1;height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 1px 2px rgba(70,40,20,.08)}
.sbar span{display:block;height:100%;border-radius:999px;background:var(--grad);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.costrow{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:var(--shadow);flex-wrap:wrap}
.costrow .sic{margin:0}
.cr-t{display:flex;flex-direction:column;flex:1;min-width:0}
.cr-t b{font-family:var(--f-display);font-size:19px}
.cr-t .muted{font-size:12.5px}
.costrow .gauge{flex-basis:100%;margin:0}
.agaspi,.storehint,.frnote{display:flex;gap:8px;align-items:flex-start;font-size:13px;margin:0 4px;color:var(--muted)}
.agaspi svg,.storehint svg,.frnote svg{color:var(--ok);flex:none;margin-top:2px}
.storehint svg,.frnote svg{color:var(--accent)}
.item .for{display:flex;align-items:center;gap:4px;color:var(--ok);font-size:11.5px;font-weight:600}
.item{transition:opacity .3s}
.item.done{opacity:.55}
details.aisle summary{list-style:none;cursor:pointer}
details.aisle summary::-webkit-details-marker{display:none}
details.aisle summary h3{margin:0;align-items:center}
details.aisle summary h3>span:first-child{display:inline-flex;align-items:center;gap:6px}
details.aisle summary h3::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 10px;transition:transform .2s}
details.aisle[open] summary h3::after{transform:rotate(-135deg);margin-bottom:-2px}
details.aisle summary h3 .muted{margin-left:auto}
details.aisle[open] ul,details.aisle[open] p{margin-top:8px}
details.aisle.done{background:transparent;box-shadow:none;border-style:dashed}
details.aisle.done summary h3{color:var(--muted)}
details.aisle.done svg{color:var(--ok)}
details.aisle.home svg{color:var(--accent)}
.store .item{padding:14px 0;font-size:17px}
.store .item input{width:26px;height:26px}
.store .aisle h3{font-size:16px}
.qchip[aria-pressed="true"]{background:var(--sel);color:var(--on-sel)}
/* frigo */
.frin .row input{flex:1}
.pchips{gap:6px}
.pchip{display:inline-flex;align-items:center;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);padding:0 2px 0 0;font-size:14px;font-weight:600;animation:cardIn .3s cubic-bezier(.2,.8,.2,1) both}
.pchip .pc-t{border:0;background:none;color:inherit;padding:8px 6px 8px 13px;display:inline-flex;align-items:center;gap:5px;font:inherit;font-weight:600}
.pchip .x{border:0;background:none;color:var(--muted);width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.pchip.star{background:var(--sel);color:var(--on-sel);border-color:transparent}
.pchip.star .x{color:inherit;opacity:.75}
.pchip.star svg{color:#f2c27b}
.qadd{display:flex;flex-direction:column;gap:6px}
.chip.ghost{border-style:dashed;background:transparent;color:var(--muted);min-height:34px;padding:6px 11px;font-size:13px}
.frfilt{display:flex;flex-direction:column;gap:8px}
.frfilt .chip svg{width:14px;height:14px}
.frsec{display:flex;flex-direction:column;gap:10px}
.frlist{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:640px){.frlist{grid-template-columns:1fr 1fr}}
.fr{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.fr-open{display:flex;gap:12px;align-items:center;border:0;background:none;padding:10px;text-align:left;color:var(--ink)}
.fr-ph{width:76px;height:76px;border-radius:16px;overflow:hidden;flex:none;background:linear-gradient(135deg,var(--surface-2),var(--line))}
.fr-ph img{width:100%;height:100%;object-fit:cover;display:block}
.fr-txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.fr-txt b{font-size:15px;line-height:1.25}
.fr-meta{font-size:12.5px;color:var(--muted)}
.fr-have{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink)}
.ring{--p:50;width:18px;height:18px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0);position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--surface)}
.fr-miss{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 10px 10px 12px;border-top:1px solid var(--line);font-size:12.5px}
.fr-miss.ok{color:var(--ok);font-weight:700}
.fr-ml{color:var(--muted);font-weight:700}
.mtag{background:#fbeee2;color:#7a3f1f;border-radius:999px;padding:3px 9px;font-weight:700}
.mtag.more{background:var(--surface-2);color:var(--muted)}
:root[data-theme="dark"] .mtag{background:#3d2618;color:#f2c9a8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mtag{background:#3d2618;color:#f2c9a8}}
.fr-add{margin-left:auto;width:34px;height:34px;border-radius:50%;border:0;background:var(--grad);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center;box-shadow:var(--glow);flex:none}
.frempty .big-ic{width:76px;height:76px;border-radius:50%;background:var(--surface-2);align-items:center;justify-content:center}
#app.enter .frlist>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter .frlist>*:nth-child(2){animation-delay:.05s}#app.enter .frlist>*:nth-child(3){animation-delay:.1s}#app.enter .frlist>*:nth-child(4){animation-delay:.15s}
/* mode cuisine */
#cook{position:fixed;inset:0;z-index:60}
.ck{position:absolute;inset:0;background:var(--bg);background-image:radial-gradient(60% 40% at 100% 0,rgba(187,119,66,.16),transparent 70%),radial-gradient(50% 35% at 0 100%,rgba(143,82,50,.10),transparent 70%);display:flex;flex-direction:column;animation:fadeIn .25s ease both}
.ck-top{display:flex;align-items:center;gap:12px;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:8px}
.ck-name{flex:1;min-width:0;display:flex;flex-direction:column;text-align:center}
.ck-name b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ck-name .muted{font-size:12px}
.ck-bar{display:flex;gap:4px;padding-bottom:6px}
.ck-bar i{flex:1;height:5px;border-radius:999px;background:var(--line);transition:background .3s,flex .3s}
.ck-bar i.done{background:var(--accent);opacity:.55}

.fiche p{margin:0;font-size:19px;line-height:1.9;color:var(--ink)}
.fpill{display:inline;border:0;padding:3px 10px;margin:0 1px;border-radius:999px;background:#F6D2B0;color:#7E2E12;font:inherit;font-weight:800;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .2s,color .2s}
.fpill.danger{background:#F7C8B8;color:#9A1F08}
.fpill.on{background:var(--sel);color:var(--on-sel)}
:root[data-theme="dark"] .fpill{background:#4A2A18;color:#FFD3AE}:root[data-theme="dark"] .fpill.danger{background:#5A1F12;color:#FFC2B0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fpill{background:#4A2A18;color:#FFD3AE}:root:not([data-theme="light"]) .fpill.danger{background:#5A1F12;color:#FFC2B0}}
.fpanel{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 16px;border-radius:20px;background:var(--sel);color:var(--on-sel);animation:cardIn .35s cubic-bezier(.2,.8,.2,1)}
.ft{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ft b{font-size:15px}
.ft span{font-size:12.5px;opacity:.8;line-height:1.3}
.fstep{display:flex;align-items:center;gap:6px;padding:4px;border-radius:999px;background:rgba(255,233,207,.12)}
.fstep button{width:38px;height:38px;border-radius:50%;border:0;background:#FFE9CF;color:#26120A;font-size:20px;font-weight:800}
.fstep button:last-child{background:#F0A93B}
.fstep b{min-width:24px;text-align:center;font-family:var(--f-display);font-size:20px}
.fh{font-size:21px;margin:6px 2px 0}
.ftiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.ftile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:22px;background:var(--surface);border:0;box-shadow:inset 0 0 0 1.5px var(--line),var(--shadow);color:var(--ink);text-align:left;font:inherit;transition:transform .16s}
.ftile:active{transform:scale(.97)}
.ftile i{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--c-bg);color:var(--c-fg)}
.ftile b{font-size:15px}
.ftile span{font-size:12.5px;color:var(--muted);line-height:1.3}
:root[data-theme="dark"] .rcat i,:root[data-theme="dark"] .ftile i{background:var(--surface-2);background:color-mix(in srgb,var(--c-bg) 22%,var(--surface));color:var(--c-bg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .rcat i,:root:not([data-theme="light"]) .ftile i{background:var(--surface-2);background:color-mix(in srgb,var(--c-bg) 22%,var(--surface));color:var(--c-bg)}}
.switchrow.olive{background:var(--olive-bg);border-color:transparent;color:var(--olive-fg)}
.switchrow.olive .muted{color:var(--olive-fg);opacity:.85}
.switchrow.olive input:checked{background:#5C6B26}
.frow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;border:0;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);color:var(--ink);text-align:left;font:inherit;width:100%}
.frow>svg{width:18px;height:18px;color:var(--muted)}
#app.enter .rail>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
#app.enter .rail>*:nth-child(2){animation-delay:.05s}#app.enter .rail>*:nth-child(3){animation-delay:.1s}
#app.enter .wdmeals>*{animation:cardIn .45s cubic-bezier(.2,.8,.2,1) both}
/* v12 */
.danger-txt{color:#A3290F!important}
:root[data-theme="dark"] .danger-txt{color:#FFB39E!important}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .danger-txt{color:#FFB39E!important}}
.pricenote{font-size:12px;color:var(--muted);margin:0 4px;line-height:1.4}
.pricenote a{color:inherit}
.item .pp{display:block;font-size:11.5px;color:var(--muted);font-weight:600;text-align:right}
@supports not (backdrop-filter:blur(1px)) and not (-webkit-backdrop-filter:blur(1px)){.tabbar .wrap{background:rgba(255,241,224,.97)}:root[data-theme="dark"] .tabbar .wrap{background:rgba(39,23,14,.97)}}
@media (prefers-reduced-transparency: reduce){.tabbar .wrap{background:var(--surface)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="cook" hidden></div>
<div id="timers" hidden aria-live="polite"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="config.js"></script>
<script src="recipes.js"></script>
<script src="icons.js"></script>
<script src="photos.js"></script>
<script src="cuisines-art.js"></script>
<script src="prices.js"></script>
<script src="app.js"></script>
</body>
</html>
